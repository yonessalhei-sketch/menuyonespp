<!DOCTYPE html>

    <title>خدمات چاپ و استیکر یونس</title>
    <!-- استفاده از فونت وزیر برای ظاهر مدرن -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --gold: #d4af37;
            --dark-bg: #1a1a1a;
            --black: #000000;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--black);
            color: white;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: var(--dark-bg);
            padding: 40px 20px;
            text-align: center;
            border-bottom: 2px solid var(--gold);
        }

        .logo-placeholder {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px;
            border: 2px dashed var(--gold);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        h1 { color: var(--gold); margin: 0; }
        p { color: #ccc; margin-top: 10px; }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 20px;
            position: sticky;
            top: 0;
            background: rgba(0,0,0,0.9);
            z-index: 1000;
        }

        .nav-btn {
            background: none;
            border: 1px solid var(--gold);
            color: var(--gold);
            padding: 10px 20px;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 5px;
        }

        .nav-btn:hover, .nav-btn.active {
            background: var(--gold);
            color: black;
        }

        .container { max-width: 1000px; margin: 20px auto; padding: 20px; }
        .section-content { display: none; animation: fadeIn 0.5s ease; }
        .section-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .gallery-grid img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #333;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        iframe {
            width: 100%;
            height: 250px;
            border-radius: 10px;
            border: 1px solid var(--gold);
        }

        footer {
            background: var(--dark-bg);
            text-align: center;
            padding: 40px 20px;
            margin-top: 50px;
            border-top: 1px solid var(--gold);
        }

        .contact-info { color: var(--gold); font-size: 1.2rem; }
    </style>
</head>

<script>
    function showSection(id, btn) {
        document.querySelectorAll('.section-content').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        btn.classList.add('active');
    }
</script>
